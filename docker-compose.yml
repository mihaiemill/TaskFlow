services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?seteaza POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow_user} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./taskflow
    ports:
      - "5179:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-taskflow};Username=${POSTGRES_USER:-taskflow_user};Password=${POSTGRES_PASSWORD:?seteaza POSTGRES_PASSWORD in .env}"
      Jwt__Key: ${JWT_KEY:?seteaza JWT_KEY in .env}
      Jwt__Issuer: "TaskFlowApi"
      Jwt__Audience: "TaskFlowClient"
      Google__ClientId: ${GOOGLE_CLIENT_ID:?seteaza GOOGLE_CLIENT_ID in .env}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:?seteaza GOOGLE_CLIENT_SECRET in .env}
      # parola contului admin@admin.com — folosită o singură dată, doar dacă adminul nu există încă
      Admin__InitialPassword: ${ADMIN_PASSWORD:-}
      ASPNETCORE_URLS: "http://+:8080"
      # BackendUrl = redirect_uri trimis la Google (trebuie să fie whitelist-uit în Google Cloud Console)
      # FrontendUrl = unde redirecționăm browserul după login (containerul nginx al frontend-ului, portul publicat 8090 — NU 5173, ăla e doar Vite dev server)
      BackendUrl: "http://localhost:5179"
      FrontendUrl: "http://localhost:8090"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./web
    ports:
      - "8090:80"
    depends_on:
      - backend
volumes:
  pgdata:
  uploads: